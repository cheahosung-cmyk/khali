<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>갓생컴퍼니 오피스 — AI 회사 심화편</title>
<style>
  :root{
    --bg:#191d26; --panel:#232836; --panel2:#2b3143; --line:#3a4157;
    --text:#e8ebf4; --dim:#9aa3bd;
    --mint:#4ad6b0; --yellow:#ffd54a; --pink:#ff4d94; --lavender:#b39ddb; --white:#f4f6fb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
    height:100vh; overflow:hidden;
  }
  #app{display:flex; height:100vh; gap:10px; padding:10px;}
  #stage{flex:1; min-width:0; position:relative; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; overflow:auto; display:flex; align-items:flex-start; justify-content:center;}
  #cv{display:block; margin:auto;}
  .hidden{display:none !important;}

  #side{width:360px; flex-shrink:0; display:flex; flex-direction:column; gap:10px; min-height:0;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px;}
  #hud .row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  #clock{font-size:26px; font-weight:800; letter-spacing:1px;}
  #speed button{background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:6px; padding:3px 9px; font-size:12px; cursor:pointer; margin-left:4px;}
  #speed button.on{color:var(--text); border-color:var(--mint); background:#22483d;}
  #stepname{font-size:13px; color:var(--text); margin-bottom:6px;}
  #bar{height:8px; background:var(--panel2); border-radius:4px; overflow:hidden;}
  #barfill{height:100%; width:0%; background:linear-gradient(90deg,var(--mint),#7de8cc); transition:width .5s;}
  #legend{display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:10px;}
  #legend span{font-size:11px; color:var(--dim); display:flex; align-items:center; gap:5px;}
  #legend i{width:9px; height:9px; border-radius:50%; display:inline-block;}


  #chat{flex:1; display:flex; flex-direction:column; min-height:0;}
  #chat h3, #elog h3{font-size:12px; color:var(--dim); margin-bottom:8px; letter-spacing:.5px;}
  #chatlog{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:7px; padding-right:4px; min-height:0;}
  .msg{max-width:92%; padding:7px 10px; border-radius:10px; font-size:12.5px; line-height:1.6; word-break:keep-all;}
  .msg.me{align-self:flex-end; background:#2f4f43; border:1px solid #3f6d5b;}
  .msg.emp{align-self:flex-start; background:var(--panel2); border:1px solid var(--line);}
  .msg.emp b{color:var(--mint); font-weight:700; display:block; font-size:11px; margin-bottom:2px;}
  #quick{display:flex; flex-wrap:wrap; gap:5px; margin:9px 0 6px;}
  #quick button{background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:14px; padding:4px 10px; font-size:11.5px; cursor:pointer;}
  #quick button:hover{border-color:var(--mint);}
  #inputrow{display:flex; gap:6px;}
  #cmd{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:8px 10px; font-size:13px; outline:none;}
  #cmd:focus{border-color:var(--mint);}
  #send{background:var(--mint); color:#10241d; border:0; border-radius:8px; padding:0 14px;
    font-size:13px; font-weight:700; cursor:pointer;}

  #elog{height:150px; display:flex; flex-direction:column;}
  #eloglist{flex:1; overflow-y:auto; font-size:11.5px; color:var(--dim); line-height:1.7;}
  #eloglist .t{color:#6d7690; margin-right:6px;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  #board h3{font-size:12px; color:var(--dim); display:flex; justify-content:space-between; cursor:pointer; letter-spacing:.5px;}
  #board h3 span{color:var(--mint); font-weight:400;}
  #board .sec-label{font-size:11px; color:var(--dim); margin:8px 0 5px;}
  #goals,#tasks{max-height:118px; overflow-y:auto;}
  .brow{display:flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:5px 8px; margin-bottom:5px; font-size:12px;}
  .brow .txt{flex:1; cursor:text; word-break:keep-all; line-height:1.5;}
  .brow input{flex:1; background:#1b2030; border:1px solid var(--mint); border-radius:6px; color:var(--text);
    padding:3px 6px; font-size:12px; outline:none; min-width:0;}
  .brow .who{color:var(--mint); font-size:11px; flex-shrink:0;}
  .brow .chip{font-size:10px; border-radius:9px; padding:1px 7px; flex-shrink:0;}
  .chip.대기{background:#3a4157; color:var(--text);}
  .chip.진행{background:#4d431f; color:var(--yellow);}
  .chip.완료{background:#1f4d40; color:var(--mint);}
  .chip.연동됨{background:#1f4d40; color:var(--mint);}
  .chip.미연동{background:#453f5c; color:var(--lavender);}
  #linkscard h3{font-size:12px; color:var(--dim); display:flex; justify-content:space-between; cursor:pointer; letter-spacing:.5px;}
  #linkscard h3 span{color:var(--mint); font-weight:400;}
  #linkscard .sec-label{font-size:11px; color:var(--dim); margin:8px 0 5px;}
  #linkscard .addrow{display:flex; gap:5px; margin-top:2px;}
  #linkscard .addrow input{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:7px;
    color:var(--text); padding:6px 8px; font-size:12px; outline:none; min-width:0;}
  #linkscard .addrow button{background:var(--mint); color:#10241d; border:0; border-radius:7px;
    padding:0 12px; font-size:12px; font-weight:700; cursor:pointer;}
  #links{max-height:104px; overflow-y:auto;}
  #cotitle{font-size:12px; color:var(--dim); margin-bottom:4px; letter-spacing:.5px;}
  #setup h3{font-size:12px; color:var(--dim); display:flex; justify-content:space-between; cursor:pointer; letter-spacing:.5px;}
  #setup h3 span{color:var(--mint); font-weight:400;}
  #setup .sec-label{font-size:11px; color:var(--dim); margin:8px 0 5px;}
  #setup .addrow{display:flex; gap:5px; margin-top:2px;}
  #setup .addrow input{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:7px;
    color:var(--text); padding:6px 8px; font-size:12px; outline:none; min-width:0;}
  #setup .addrow input:focus{border-color:var(--mint);}
  #setup .addrow button{background:var(--mint); color:#10241d; border:0; border-radius:7px;
    padding:0 12px; font-size:12px; font-weight:700; cursor:pointer;}
  #setup .addrow button.ghost{flex:1; background:var(--panel2); border:1px solid var(--line);
    color:var(--text); font-weight:400; padding:6px 0;}
  #setup .addrow button.ghost:hover{border-color:var(--mint);}
  #deptlist{max-height:104px; overflow-y:auto;}
  .lbtn{background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:6px;
    padding:2px 8px; font-size:11px; cursor:pointer; flex-shrink:0;}
  .lbtn:hover{border-color:var(--mint);}
  .brow .del{background:none; border:0; color:var(--dim); cursor:pointer; font-size:13px; flex-shrink:0;}
  .brow .del:hover{color:var(--pink);}
  #board .addrow{display:flex; gap:5px; margin-top:2px;}
  #board .addrow input{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:7px;
    color:var(--text); padding:6px 8px; font-size:12px; outline:none; min-width:0;}
  #board .addrow input:focus{border-color:var(--mint);}
  #board .addrow select{max-width:112px; background:var(--panel2); border:1px solid var(--line);
    border-radius:7px; color:var(--text); font-size:12px; padding:4px;}
  #board .addrow button{background:var(--mint); color:#10241d; border:0; border-radius:7px;
    padding:0 12px; font-size:12px; font-weight:700; cursor:pointer;}

  /* 좁은 화면: 지도 위·지시창 아래로 세로 배치 */
  @media (max-width:1080px){
    body{height:auto; overflow:auto;}
    #app{flex-direction:column; height:auto;}
    #stage{min-height:340px; max-height:62vh;}
    #side{width:100%;}
    #chat{min-height:260px;}
    #chatlog{max-height:200px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
  </div>
  <aside id="side">
    <div class="card" id="hud">
      <div id="cotitle">나의 AI 회사</div>
      <div class="row">
        <div id="clock">07:00</div>
        <div id="speed">
          <button data-s="1" class="on">1x</button><button data-s="2">2x</button><button data-s="4">4x</button>
        </div>
      </div>
      <div id="stepname">출근 준비 중…</div>
      <div id="bar"><div id="barfill"></div></div>
      <div id="legend">
        <span><i style="background:var(--mint)"></i>완료</span>
        <span><i style="background:var(--yellow)"></i>진행 중</span>
        <span><i style="background:var(--pink)"></i>승인 대기</span>
        <span><i style="background:var(--lavender)"></i>연동 대기</span>
        <span><i style="background:var(--white)"></i>대기</span>
      </div>
    </div>

    <div class="card" id="setup">
      <h3 id="setup-head">회사 설정 <span id="setup-toggle">접기</span></h3>
      <div id="setup-body">
        <div class="addrow"><input id="cname" placeholder="회사 이름"><button id="cname-save">저장</button></div>
        <div class="sec-label">부서 (최대 12개 · 부서당 3명)</div>
        <div id="deptlist"></div>
        <div class="addrow"><input id="dept-in" placeholder="부서 추가 — 예: 기획팀"><button id="dept-add">추가</button></div>
        <div class="addrow" style="margin-top:6px">
          <button id="load-preset" class="ghost">예시 회사 불러오기</button>
          <button id="reset-all" class="ghost">전체 초기화</button>
        </div>
      </div>
    </div>

    <div class="card" id="board">
      <h3 id="board-head">목표·업무 보드 <span id="board-toggle">접기</span></h3>
      <div id="board-body">
        <div class="sec-label">오늘의 목표 (클릭해서 수정)</div>
        <div id="goals"></div>
        <div class="addrow"><input id="goal-in" placeholder="목표 추가 — 예: 릴스 1건 완성"><button id="goal-add">추가</button></div>
        <div class="sec-label">시킬 일 (담당자를 골라 직접 지시)</div>
        <div id="tasks"></div>
        <div class="addrow">
          <select id="task-who"></select>
          <input id="task-in" placeholder="예: 이번 주 정산 내역 정리">
          <button id="task-add">지시</button>
        </div>
      </div>
    </div>

    <div class="card" id="linkscard">
      <h3 id="links-head">연동 관리 <span id="links-toggle">접기</span></h3>
      <div id="links-body">
        <div class="sec-label">연결이 준비된 항목만 켜 주세요. 주소·키·비밀번호는 적지 않습니다.</div>
        <div id="links"></div>
        <div class="addrow"><input id="link-in" placeholder="연동 항목 추가 — 예: 유튜브 지표"><button id="link-add">추가</button></div>
      </div>
    </div>

    <div class="card" id="chat">
      <h3>대표 지시창</h3>
      <div id="chatlog"></div>
      <div id="quick">
        <button data-q="현황 보고">현황 보고</button>
        <button data-q="왜 늦어져?">왜 늦어져?</button>
        <button data-q="회의 소집">회의 소집</button>
        <button data-q="집중 모드">집중 모드</button>
      </div>
      <div id="inputrow">
        <input id="cmd" placeholder='예: "재무팀 뭐해?", "오재민 왜 안 움직여?"'>
        <button id="send">전송</button>
      </div>
    </div>

    <div class="card" id="elog">
      <h3>업무 일지</h3>
      <div id="eloglist"></div>
    </div>
  </aside>
</div>

<script>
'use strict';
/* ================= 기본 상수 ================= */
const TILE=22, GW=42, GH=27;
const FLOOR=0, WALL=1, FURN=2;
const ST={DONE:'완료', WORK:'진행 중', APPROVE:'승인 대기', LINK:'연동 대기', IDLE:'대기'};
const STCOLOR={ '완료':'#4ad6b0','진행 중':'#ffd54a','승인 대기':'#ff4d94','연동 대기':'#b39ddb','대기':'#f4f6fb' };
const STBUBBLE={ '완료':'완료했어요!','진행 중':'일하는 중…','승인 대기':'확인해주세요','연동 대기':'연결 기다려요','대기':'업무 대기중' };
let SPEED=1;
const wait=ms=>new Promise(r=>setTimeout(r, ms/SPEED));
const store={
  get(k,d){ try{ const v=localStorage.getItem('godsaeng.'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('godsaeng.'+k, JSON.stringify(v)); }catch(e){} }
};

/* ================= 지도 ================= */
const grid=[], roomTint=[];
for(let y=0;y<GH;y++){ grid.push(new Array(GW).fill(FLOOR)); roomTint.push(new Array(GW).fill(null)); }

function rect(x0,y0,x1,y1,fn){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) fn(x,y); }
function buildRoom(x0,y0,x1,y1,doors,tint){
  rect(x0,y0,x1,y1,(x,y)=>{
    const edge = x===x0||x===x1||y===y0||y===y1;
    grid[y][x]= edge?WALL:FLOOR;
    roomTint[y][x]=tint;
  });
  doors.forEach(([dx,dy])=>{ grid[dy][dx]=FLOOR; });
}

/* ===== 회사 정의 — 대표가 직접 세팅한다 (기본은 빈 회사) ===== */
const PALETTE=['#39536b','#3f4b6e','#54446b','#6b3f52','#6b5a3f','#3f6b4a','#436b3f','#6b613f','#3f5c6b','#5c3f6b','#6b483f','#40606b'];
const SECRETARY={n:'김세리',code:'김비서',role:'실장',duty:'전사 브리핑·지시창',tic:'결론부터 말씀드릴게요.'};
const PRESET_DEPTS=[
 {name:'시장조사팀',short:'시장조사',keys:['시장','조사'],color:'#39536b',members:[

   {n:'문태호',code:'문뉴스',role:'팀원',duty:'AI 뉴스 수집',tic:'오늘자 뉴스 긁어왔어요.'},
   {n:'서가을',code:'서트렌드',role:'팀원',duty:'크리에이터 동향',tic:'요즘 이게 뜨더라고요.'}]},
 {name:'브랜드 인텔리전스팀',short:'브랜드인텔',keys:['인텔','지표팀'],color:'#3f4b6e',members:[
   {n:'백도윤',code:'백브랜드',role:'팀장',duty:'페르소나 적합성',tic:'우리답냐가 기준이에요.'},
   {n:'임채린',code:'임지표',role:'팀원',duty:'계정 지표',tic:'숫자는 거짓말 안 해요.'},
   {n:'곽민준',code:'곽페르소나',role:'팀원',duty:'페르소나 검증',tic:'이건 우리 톤이 아니에요.'}]},

   {n:'유하준',code:'유소재',role:'팀원',duty:'소재 발굴',tic:'소재는 널려 있어요.'},

   {n:'진서연',code:'진텍스트',role:'팀원',duty:'텍스트 교체',tic:'글자만 바꾸면 돼요.'}]},
 {name:'파트너십 소통팀',short:'파트너십',keys:['파트너','협업'],color:'#6b613f',members:[
   {n:'감우진',code:'감협업',role:'팀장',duty:'협업 적합성 판단',tic:'결이 맞아야 해요.'},
   {n:'배다인',code:'배답장',role:'팀원',duty:'답장 초안',tic:'초안만 쓸게요, 발송은 대표님이.'}]},
 {name:'재무·사업관리팀',short:'재무',keys:['재무','정산','사업관리'],color:'#3f5c6b',members:[

/* ================= A* 경로 탐색 ================= */
function astar(sx,sy,tx,ty,extra){
  if(sx===tx&&sy===ty) return [];
  const K=(x,y)=>y*GW+x;
  const isBlocked=(x,y)=> blocked(x,y) || (extra && extra.has(K(x,y)) && !(x===tx&&y===ty));
  if(isBlocked(tx,ty) && blocked(tx,ty)) return null;
  const open=[{x:sx,y:sy,g:0,f:Math.abs(tx-sx)+Math.abs(ty-sy)}];
  const gmap=new Map([[K(sx,sy),0]]), came=new Map(), closed=new Set();
  while(open.length){
    let bi=0; for(let i=1;i<open.length;i++) if(open[i].f<open[bi].f) bi=i;
    const cur=open.splice(bi,1)[0], ck=K(cur.x,cur.y);
    if(cur.x===tx&&cur.y===ty){
      const path=[]; let k=ck;
      while(came.has(k)){ path.push({x:k%GW,y:Math.floor(k/GW)}); k=came.get(k); }
      return path.reverse();
    }
    if(closed.has(ck)) continue; closed.add(ck);
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cur.x+dx, ny=cur.y+dy;
      if(isBlocked(nx,ny)) continue;
      const nk=K(nx,ny), ng=cur.g+1;
      if(gmap.has(nk)&&gmap.get(nk)<=ng) continue;
      gmap.set(nk,ng); came.set(nk,ck);
      open.push({x:nx,y:ny,g:ng,f:ng+Math.abs(tx-nx)+Math.abs(ty-ny)});
    }
  }
  return null;
}

let emps=[];
class Emp{
  constructor(d, dept, seat, isCEO){
    this.name=d.n; this.code=d.code; this.role=d.role; this.duty=d.duty; this.tic=d.tic;
    this.dept=dept; this.home=seat; this.isCEO=!!isCEO;
    this.x=ENTRANCE[0]; this.y=ENTRANCE[1]; this.px=this.x*TILE+TILE/2; this.py=this.y*TILE+TILE/2;
    this.state=ST.IDLE; this.path=null; this.walkDone=null; this.spawned=false;
    this.bubble=null; this.inMeeting=false; this.summoned=false; this.wandering=false;
    this.stuckAt=0;
    // 캐릭터 외형 (인덱스 기반 고정)
    this.seed=Emp._seq=(Emp._seq||0)+1; this.faceDx=0;
    const skins=['#ffd9b3','#f6cba4','#eab890'];
    const hairs=['#3a2a1d','#584338','#7a5a3a','#2b2b33','#8a5a3d','#b5835a','#5c3a52','#733d2e','#41465c'];
    this.look={ skin:skins[this.seed%skins.length], hair:hairs[(this.seed*3)%hairs.length], style:this.seed%4 };
  }
  get tileKey(){ return this.y*GW+this.x; }
  walkTo(tx,ty){
    if(this.walkDone){ this.walkDone(false); this.walkDone=null; } // 이전 이동 취소
    const occ=new Set();
    for(const e of emps) if(e!==this && e.spawned && !e.path) occ.add(e.tileKey);
    let p=astar(this.x,this.y,tx,ty,occ) || astar(this.x,this.y,tx,ty,null);
    if(!p || !p.length){ this.path=null; return Promise.resolve(true); }
    this.path=p; this.tx=tx; this.ty=ty;
    return new Promise(r=>{ this.walkDone=r; });
  }
  update(dt){
    if(!this.path || !this.path.length) return;
    const nt=this.path[0];
    // 서 있는 다른 직원이 다음 칸에 있으면 돌아간다
    const blocker=emps.find(e=>e!==this && e.spawned && !e.path && e.x===nt.x && e.y===nt.y);
    if(blocker){
      if(this.path.length===1){ // 목적지 자체가 점유됨 → 옆 칸에서 멈춤
        this.path=null; if(this.walkDone){ this.walkDone(true); this.walkDone=null; } return;
      }
      this.stuckAt+=dt;
      if(this.stuckAt>0.4){
        this.stuckAt=0;
        const occ=new Set(); for(const e of emps) if(e!==this&&e.spawned&&!e.path) occ.add(e.tileKey);
        const p=astar(this.x,this.y,this.tx,this.ty,occ);
        if(p&&p.length) this.path=p;
      }
      return;
    }
    this.stuckAt=0;
    const gx=nt.x*TILE+TILE/2, gy=nt.y*TILE+TILE/2;
    const sp=TILE*3.4*SPEED*dt;
    const dx=gx-this.px, dy=gy-this.py, dist=Math.hypot(dx,dy);
    if(Math.abs(dx)>0.5) this.faceDx = dx>0?1:-1;
    if(dist<=sp){
      this.px=gx; this.py=gy; this.x=nt.x; this.y=nt.y; this.path.shift();
      if(!this.path.length){ this.path=null; if(this.walkDone){ this.walkDone(true); this.walkDone=null; } }
    }else{
      this.px+=dx/dist*sp; this.py+=dy/dist*sp;
    }
  }
  say(text,ms){ this.bubble={text, until:performance.now()+(ms||2400)/SPEED}; }
}

/* ================= 자율 행동 (커피) ================= */
async function wanderLoop(){
  while(true){
    await wait(5200);
    if(focusMode) continue;
    const wandering=emps.filter(e=>e.wandering).length;
    if(wandering>=3) continue;
    const cands=emps.filter(e=>!e.isCEO && !e.inMeeting && !e.summoned && !e.wandering &&
      (e.state===ST.IDLE || e.state===ST.DONE) && !e.path && Math.random()<0.5);
    const e=cands[Math.floor(Math.random()*cands.length)];
    if(!e) continue;
    e.wandering=true;
    (async()=>{
      const s=COFFEE_SPOTS[Math.floor(Math.random()*COFFEE_SPOTS.length)];
      await e.walkTo(s[0],s[1]);
      if(!e.summoned && !focusMode){ e.say('커피 한 잔…',2600); await wait(4200); }
      if(!e.summoned && !e.inMeeting) await e.walkTo(e.home[0],e.home[1]);
      e.wandering=false;
    })();
  }
}

// 채팅 지시문에서 업무 내용만 추려낸다 ("오재민한테 정산 정리 시켜" → "정산 정리")
function extractTask(q, name){
  let c=q;
  if(c.includes(':')) c=c.slice(c.indexOf(':')+1);
  else c=c.replace(name,' ');
  c=c.replace(/(에게|한테)\s/g,' ').replace(/^\s*(에게|한테|에)\s+/,'').replace(/^\s*(지시|업무)\s*/,'');
  c=c.replace(/(좀|을|를)?\s*(시켜\s*줘|시켜|하라고\s*해\s*줘?|해\s*주세요|해\s*줘|해라|부탁해요?|부탁)\s*[.!?~]*\s*$/,'');
  return c.trim();
}

const isOrderText=q=> ORDER_RE.test(q) || /(해\s*줘|해\s*주세요|해라|하자|합시다)\s*[.!?~]*$/.test(q);

async function summonMeeting(){
  if(!rooms.some(r=>r.dept.members.length)){
    chatEmp(SEC,'소집할 팀장이 아직 없어요. 부서를 만들고 채용부터 해주세요.'); return;
  }

  log('대표 지시: <b>회의 소집</b>');
  const leaders=rooms.filter(r=>r.dept.members.length).map(r=>byName(r.dept.members[0].n)).filter(e=>e&&!e.inMeeting);
  leaders.forEach(e=>{ e.summoned=true; });
  await Promise.all(leaders.map((e,i)=>{ const s=MEET_SEATS[i%MEET_SEATS.length]; return e.walkTo(s[0],s[1]); }));

// 목표 내용으로 맡을 부서를 고른다
function pickDeptForGoal(text){
  const cands=rooms.filter(r=>r.dept.members.length);
  if(!cands.length) return null;
  let best=cands[0], score=-1;
  for(const r of cands){
    const words=[r.dept.name,...(r.dept.keys||[]),...r.dept.members.map(m=>m.duty||'')].join(' ');
    let sc=0;
    for(const tk of words.split(/[\s·,]+/)) if(tk.length>=2 && text.includes(tk.replace('팀',''))) sc++;
    if(sc>score){ score=sc; best=r; }
  }
  return {dept:best.dept, reason: score>0? `내용상 ${best.dept.name} 소관이라 여기서 맡을게요.` : `${best.dept.name}이 제일 가까워서 맡을게요.`};
}

  if(!goals.length){
    chatEmp(SEC,'등록된 오늘의 목표가 없어요. 위 목표·업무 보드에 먼저 추가해 주시면 바로 배정할게요.'); return;
  }
  const goal=goals[0];
  const existing=tasks.find(t=>t.text===`[오늘의 목표] ${goal}`);
  if(existing){
    chatEmp(SEC, `오늘의 목표 "${goal}"는 이미 ${existing.who}에게 배정돼 있고 지금 "${existing.status}"예요. 다른 일보다 먼저 하라고 다시 당부했어요.`);
    const e=byName(existing.who); if(e) e.say('목표 최우선으로 할게요!',2400);
    return;
  }
  const pick=pickDeptForGoal(goal);
  if(!pick){ chatEmp(SEC,'목표는 알겠는데 맡길 직원이 아직 없어요. 회사 설정에서 부서를 만들고 채용부터 해주세요.'); return; }
  const lead=byName(pick.dept.members[0].n);
  chatEmp(SEC, `오늘의 목표 "${goal}" 전 부서에 전파했어요. 나머지 분석은 목표에 필요한 것만 남기고, 실행은 ${pick.dept.name}에 맡길게요.`);
  emps.forEach((e,i)=>{ if(!e.isCEO) setTimeout(()=>e.say('목표 확인했어요!',2200), (i%8)*260); });
  log(`대표 지시: <b>오늘의 목표 우선</b> — ${goal}`);
  addTask(lead.name, `[오늘의 목표] ${goal}`);
  chatEmp(lead, pick.reason);
}

function hireEmp(room, name, duty){
  const d=room.dept;
  if(byName(name)){ chatEmp(SEC,`이미 ${name}이라는 직원이 있어요. 다른 이름으로 부탁드려요.`); return; }
  const used=emps.filter(x=>x.dept===d).map(x=>x.home.join(','));
  const si=[0,1,2].find(i=>!used.includes(room.seats[i].join(',')));
  if(si===undefined){ chatEmp(SEC,`${d.name}은 자리가 꽉 찼어요(방당 최대 3명). 먼저 한 명을 내보내야 채용할 수 있어요.`); return; }
  const m={n:name, code:name, role:(d.members.length===0?'팀장':'팀원'), duty:duty||'지원 업무', tic:'맡겨주세요!'};
  d.members.push(m);
  const deskPos=[[room.rx+2,room.ry+2],[room.rx+4,room.ry+2],[room.rx+2,room.ry+4]][si];
  grid[deskPos[1]][deskPos[0]]=FURN;
  const e=new Emp(m, d, room.seats[si]);
  emps.push(e); e.spawned=true; e.walkTo(e.home[0],e.home[1]);
  saveCompany();
  chatEmp(e, `${name}입니다! 오늘부터 ${d.name} ${m.duty} 담당으로 열심히 하겠습니다.`);
  log(`채용: ${d.short} <b>${name}</b> (${m.role}·${m.duty})`);
  refreshWhoSelect(); renderDepts();
}
async function fireEmp(e){
  if(e.isCEO){ chatEmp(SEC,'대표님은 해고할 수 없어요. 여기가 대표님 회사인걸요.'); return; }
  if(e.name==='김세리'){ chatEmp(SEC,'저를 내보내시면 보고드릴 사람이 없어요. 저 말고 다른 직원으로 부탁드려요.'); return; }
  e.dept.members=e.dept.members.filter(m=>m.n!==e.name);
  saveCompany(); refreshWhoSelect(); renderDepts();
  chatEmp(SEC, `${e.dept.short} ${e.name} 퇴사 처리했어요. 진행 중이던 지시 업무는 보류로 남습니다.`);
  log(`퇴사: ${e.dept.short} <b>${e.name}</b>`);
  e.inMeeting=false; e.summoned=false; e.state=ST.IDLE; e.fired=true;
  e.say('그동안 감사했습니다!',2600);
  await e.walkTo(ENTRANCE[0],ENTRANCE[1]);
  const i=emps.indexOf(e); if(i>=0) emps.splice(i,1);
}

function resolveLink(q){
  const hit=Object.entries(links).find(([k,l])=> !l.on && (
    (q.includes('지표')&&k==='insta') || (q.includes('메일')&&k==='mail') ||
    (q.includes('자동화')&&k==='auto') || q.includes(l.name)));
  if(hit){ setLink(hit[0],true); return; }
  const offs=Object.entries(links).filter(([k,l])=>!l.on);
  if(!offs.length){ chatEmp(SEC,'모든 연동이 이미 켜져 있어요.'); return; }
  offs.forEach(([k])=>setLink(k,true));
}

function handleCommand(raw){
  const q=raw.trim(); if(!q) return;
  chatMe(q);
  const ql=q.toLowerCase();
  if(ql.includes('집중')){ toggleFocus(); return; }
  if(q.includes('회의') && (q.includes('소집')||q.includes('모여')||q.includes('열어'))){ summonMeeting(); return; }
  if(q.includes('목표')){ focusOnGoal(); return; }
  if(/자동 사이클|자동 모드|시나리오/.test(q)){
    chatEmp(SEC,'자동 시나리오는 폐지했어요. 회사는 대표님이 시키는 일만 합니다.'); return;
  }
  // 부서 신설/폐지
  if(q.includes('부서') && /(추가|만들|신설|생성)/.test(q)){
    const nm=/[:：]/.test(q)? q.slice(q.search(/[:：]/)+1).trim()
      : q.replace(/부서|추가|만들어\s*줘|만들어|만들자|신설|생성|해\s*줘|해/g,' ').trim();
    addDept(nm); return;
  }
  if(q.includes('부서') && /(삭제|없애|폐지)/.test(q)){
    const d=company.depts.find(d=> q.includes(d.name) || q.includes(d.short));
    if(d) removeDept(d);
    else chatEmp(SEC,'어느 부서를 없앨지 이름을 함께 적어주세요. 예: "기획팀 부서 삭제"');
    return;
  }
  // 채용·해고
  if(/채용|입사|영입/.test(q)){
    const rest=/[:：]/.test(q)? q.slice(q.search(/[:：]/)+1) : q.replace(/채용|입사|영입/g,' ');
    const parts=rest.split(',').map(s=>s.trim()).filter(Boolean);
    const room2=parts[0]&&rooms.find(r=> parts[0].includes(r.dept.short)||r.dept.name.includes(parts[0])||r.dept.keys.some(k=>parts[0].toLowerCase().includes(k)));
    if(!room2||parts.length<2){
      chatEmp(SEC,'채용은 이렇게 말씀해 주세요 — "채용: 재무, 김철수, 정산 보조" (부서, 이름, 역할 순)'); return;
    }
    hireEmp(room2, parts[1], parts[2]); return;
  }
  if(/해고|퇴사|내보내/.test(q)){
    const t=emps.find(e=>!e.isCEO && q.includes(e.name));
    if(!t){ chatEmp(SEC,'누구를 내보낼지 이름을 함께 적어주세요. 예: "명하늘 해고"'); return; }
    fireEmp(t); return;
  }
  // 클로드/AI 연동 질문 — 정직하게 답한다
  if(/클로드|claude|지피티|gpt|인공지능/i.test(q)){
    chatEmp(SEC,'솔직히 말씀드릴게요. 이 프로그램은 안전 규칙 때문에 외부 AI·API 연결을 넣지 않았어요(키 노출·비용·외부 전송 문제). 제가 모르는 건 이 화면을 만들어 준 클로드 채팅에 직접 물어봐 주세요 — 필요한 기능은 다음 업데이트로 저희한테 가르쳐 줄 수 있어요.');
    return;
  }
  // 연동/연결 관련
  if(/연동|연결/.test(q)){
    if(/완료|됐|됨|성공|해제|풀어/.test(q)){ resolveLink(q); return; }
    chatEmp(SEC,'오른쪽 연동 관리 칸에서 항목별로 [연결]을 누르시면 돼요. 이 프로그램은 안전 규칙상 실제 접속 정보(키·주소)를 담지 않아서, 연동 표시와 담당 직원 가동 상태만 관리합니다. 새 항목이 필요하면 칸 아래 입력으로 추가해 주세요.');
    return;
  }
  // 완료물 위치 / 됐는지 질문
  if(/(완료된|결과물|산출물|어디서\s*보|어디서\s*확인|어디서봐)/.test(q)){
    const done=tasks.filter(t=>t.status==='완료');
    chatEmp(SEC, done.length
      ? `완료된 지시는 ${done.length}건 — 목표·업무 보드의 '완료' 칩에서 볼 수 있어요. 최근: ${done.slice(-3).map(t=>`${t.who} "${t.text}"`).join(' / ')}. 다만 기획안·문서 같은 실제 산출물은 이 화면이 만들지 못해요 — 그런 일은 클로드 채팅에 시키면 진짜 파일로 받아보실 수 있어요.`
      : '아직 완료된 지시가 없어요. 업무를 시키시면 완료되는 대로 보드에 표시할게요.');
    return;
  }
  if(/(다\s*[했헀]|끝났|(됐|됬)어)/.test(q)){
    const last=tasks[tasks.length-1];
    chatEmp(SEC, last? `마지막 지시 "${last.text}"(${last.who})는 지금 "${last.status}" 상태예요.`
                     : '아직 지시하신 일이 없어요. 시킬 일을 말씀해 주세요.');
    return;
  }
  // 직원 이름이 들어간 말은 그 사람이 받는다 (지시면 업무 등록, 아니면 상태 답변)
  const person=emps.find(e=>!e.isCEO && !e.fired && q.includes(e.name)) || emps.find(e=>!e.isCEO && !e.fired && q.includes(e.code));
  if(person){
    if(isOrderText(q)){
      const content=extractTask(q, person.name);
      if(content.length>=2){ addTask(person.name, content); return; }
      chatEmp(SEC, `무엇을 시킬지 내용을 같이 적어주세요. 예: "${person.name}한테 정산 정리 시켜"`); return;
    }
    if(person.role==='팀장'||person.role==='실장'){
      chatEmp(person, `${person.dept.name} 상황이요. ${teamStatusLine(person.dept)}. ${person.tic}`);
    } else personAnswer(person);
    return;
  }
  // 부서명 (지시면 팀장에게 업무 등록)
  const room=rooms.find(r=> q.includes(r.dept.short) || q.includes(r.dept.name) || r.dept.keys.some(k=>ql.includes(k)));
  if(room){
    const lead=byName(room.dept.members[0].n);
    if(isOrderText(q)){
      const lit=[room.dept.name, room.dept.short+'팀', room.dept.short].find(s=>q.includes(s));
      const content=extractTask(lit? q.replace(lit,' ') : q, '§');
      if(content.length>=2){ addTask(lead.name, content); return; }
    }
    chatEmp(lead, `${room.dept.name} 상황 보고드려요. ${teamStatusLine(room.dept)}. ${lead.tic}`);
    return;
  }
  if(q.includes('늦')||q.includes('왜 안')||q.includes('병목')){ answerWhySlow(); return; }
  if(q.includes('현황')||q.includes('상황')||/^보고/.test(q)){ answerStatus(); return; }
  // 전체를 향한 독려·지시는 방송으로 전파
  if(/(다들|모두|전원|여러분)/.test(q)){ broadcastOrder(q); return; }
  // 질문형이면 최선의 현황 답변
  if(q.endsWith('?')||/(뭐|어때|어떻|언제|누가|얼마나)/.test(q)){ answerStatus(); return; }
  if(q.length<2){ chatEmp(SEC,'짧아서 못 알아들었어요. 한 번만 더 말씀해 주세요.'); return; }
  // 그 외 대표의 모든 말은 지시로 접수 — 내용에 맞는 부서에 배정
  const pick=pickDeptForGoal(q);
  if(!pick){ chatEmp(SEC,'지시로 접수하고 싶은데 맡길 직원이 없어요. 회사 설정 칸에서 부서를 만들고 "채용: 부서, 이름, 역할"로 뽑아주세요.'); return; }
  const lead2=byName(pick.dept.members[0].n);
  const content2=extractTask(q,'§')||q;
  chatEmp(SEC, `지시로 접수했어요. 내용상 ${pick.dept.name} 소관이라 ${lead2.name} ${lead2.role}에게 배정할게요. 진행은 업무 보드에서 보실 수 있어요.`);
  addTask(lead2.name, content2);
}

/* ================= 렌더링 ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1, 2);
cv.width=GW*TILE*dpr; cv.height=GH*TILE*dpr;
cv.style.width=GW*TILE+'px'; cv.style.height=GH*TILE+'px';
ctx.scale(dpr,dpr);

function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,Math.round(((n>>16)&255)*f)), g=Math.min(255,Math.round(((n>>8)&255)*f)), b=Math.min(255,Math.round((n&255)*f));
  return `rgb(${r},${g},${b})`;
}
function drawMap(){
  ctx.fillStyle='#141821'; ctx.fillRect(0,0,GW*TILE,GH*TILE);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const t=grid[y][x], tint=roomTint[y][x];
    if(t===WALL){ ctx.fillStyle='#0e1118'; ctx.fillRect(x*TILE,y*TILE,TILE,TILE); continue; }
    let base = tint? shade(tint, .78) : '#20242f';
    if(!tint) base=((x+y)%2)?'#20242f':'#222634';
    else if((x+y)%2) base=shade(tint,.7);
    ctx.fillStyle=base; ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
    if(t===FURN){
      ctx.fillStyle='#4a3b2c'; ctx.fillRect(x*TILE+2,y*TILE+2,TILE-4,TILE-4);
      ctx.fillStyle='#77c0e0'; ctx.fillRect(x*TILE+5,y*TILE+5,TILE-10,6);
    }
  }
  // 방 라벨
  ctx.textAlign='left'; ctx.font='700 10px sans-serif';
  rooms.forEach(r=>{
    ctx.fillStyle='rgba(232,235,244,.55)';
    ctx.fillText(r.dept.short, r.rx*TILE+7, r.labelY*TILE+14);
  });
  ctx.fillStyle='rgba(232,235,244,.55)';
  ctx.fillText('회의실', 2*TILE+4, 10*TILE+14);
  ctx.fillText('대표실', 16*TILE+4, 10*TILE+14);
  ctx.fillText('라운지', 30*TILE+4, 10*TILE+14);
  ctx.save(); ctx.translate(0*TILE+15, 13*TILE+4); ctx.rotate(-Math.PI/2);
  ctx.fillStyle='rgba(74,214,176,.8)'; ctx.fillText('출입구', -18, 0); ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawEmp(e,now){
  if(!e.spawned) return;
  const moving=!!e.path;
  const swing=Math.sin(now/85 + e.seed);
  const bob = moving? Math.abs(swing)*1.6 : (e.state===ST.WORK? Math.sin(now/170+e.seed)*0.9 : 0);
  const x=e.px, feetY=e.py+8, by=feetY-bob;
  const shirt = e.isCEO? '#3d4152' : shade(e.dept.color||'#666',1.9);

  // 그림자
  ctx.beginPath(); ctx.ellipse(x,e.py+8.5,7,2.6,0,0,Math.PI*2); ctx.fillStyle='rgba(0,0,0,.32)'; ctx.fill();

  // 다리 (걸을 때 교차)
  const l1= moving? Math.max(0, swing*2.4):0, l2= moving? Math.max(0,-swing*2.4):0;
  ctx.fillStyle='#262a38';
  ctx.fillRect(x-4.5, by-3-l1, 4, 3+l1);
  ctx.fillRect(x+0.5, by-3-l2, 4, 3+l2);

  // 몸통 (팀 셔츠)
  ctx.fillStyle=shirt;
  roundRect(x-5.5, by-12, 11, 10, 3.5); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1; ctx.stroke();
  if(e.isCEO){ // 넥타이
    ctx.fillStyle='#e8c15a'; ctx.fillRect(x-1, by-11, 2, 6);
  }else if(e.role==='팀장'||e.role==='실장'){ // 팀장 배지
    ctx.fillStyle='#ffd54a'; ctx.fillRect(x+2.4, by-10.5, 2.4, 2.4);
  }

  // 팔 (작업 중이면 타닥타닥)
  const armY = e.state===ST.WORK? by-7+Math.sin(now/110+e.seed)*1.4 : by-7 + (moving? swing*1.6 : 0);
  ctx.fillStyle=e.look.skin;
  ctx.beginPath(); ctx.arc(x-6.2, armY, 1.7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+6.2, e.state===ST.WORK? by-7-Math.sin(now/110+e.seed)*1.4 : armY, 1.7, 0, Math.PI*2); ctx.fill();

  // 머리
  const hy=by-17.5;
  ctx.beginPath(); ctx.arc(x, hy, 6.2, 0, Math.PI*2); ctx.fillStyle=e.look.skin; ctx.fill();
  // 머리카락 (윗머리 + 스타일)
  ctx.fillStyle=e.look.hair;
  ctx.beginPath(); ctx.arc(x, hy-0.8, 6.2, Math.PI, Math.PI*2); ctx.fill();
  if(e.look.style===1){ ctx.fillRect(x+2.6, hy-2, 3.4, 4.2); }               // 옆머리
  else if(e.look.style===2){ ctx.beginPath(); ctx.arc(x, hy-7.4, 2.6, 0, Math.PI*2); ctx.fill(); } // 똥머리
  else if(e.look.style===3){ ctx.fillRect(x-7.4, hy-2, 3, 8.4); ctx.fillRect(x+4.4, hy-2, 3, 8.4); } // 긴머리
  if(e.isCEO){ // 왕관
    ctx.fillStyle='#ffd54a';
    ctx.beginPath();
    ctx.moveTo(x-5, hy-5); ctx.lineTo(x-5, hy-9.5); ctx.lineTo(x-2.4, hy-6.5);
    ctx.lineTo(x, hy-10.5); ctx.lineTo(x+2.4, hy-6.5); ctx.lineTo(x+5, hy-9.5); ctx.lineTo(x+5, hy-5);
    ctx.closePath(); ctx.fill();
  }
  // 눈 (깜빡임 + 진행 방향)
  const fx=e.faceDx*1.1;
  const open=((now/1000 + e.seed*0.7) % 3.4) > 0.14;
  ctx.fillStyle='#2b2430';
  if(open){
    ctx.beginPath(); ctx.arc(x-2.2+fx, hy+1.2, 1.25, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+2.2+fx, hy+1.2, 1.25, 0, Math.PI*2); ctx.fill();
  }else{
    ctx.fillRect(x-3.2+fx, hy+1, 2.2, 1); ctx.fillRect(x+1+fx, hy+1, 2.2, 1);
  }
  // 볼터치 + 입
  ctx.fillStyle='rgba(255,140,160,.45)';
  ctx.beginPath(); ctx.arc(x-3.8+fx*0.5, hy+3.2, 1.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+3.8+fx*0.5, hy+3.2, 1.2, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='#7a4a45'; ctx.lineWidth=0.9;
  ctx.beginPath(); ctx.arc(x+fx, hy+3.4, 1.5, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();

  // 상태 점
  ctx.beginPath(); ctx.arc(x+7.5, hy-4.5, 3.6, 0, Math.PI*2);
  ctx.fillStyle=STCOLOR[e.state]; ctx.fill();
  ctx.lineWidth=1; ctx.strokeStyle='#141821'; ctx.stroke();
  if(e.state===ST.APPROVE){
    const p=(now/700)%1;
    ctx.beginPath(); ctx.arc(x, by-10, 11+p*8, 0, Math.PI*2);
    ctx.strokeStyle=`rgba(255,77,148,${1-p})`; ctx.lineWidth=2; ctx.stroke();
  }
  ctx.font='9px sans-serif'; ctx.textAlign='center';
  ctx.fillStyle='rgba(232,235,244,.85)';
  ctx.fillText(e.name, x, e.py+19);
}
function drawBubble(e,now){
  if(!e.spawned) return;
  let text=null;
  if(e.bubble && e.bubble.until>now) text=e.bubble.text;
  else if(e.bubble) e.bubble=null;
  if(!text && (e.state===ST.APPROVE||e.state===ST.LINK)) text=STBUBBLE[e.state];
  if(!text) return;
  ctx.font='10px sans-serif';
  const w=Math.min(ctx.measureText(text).width+14, 240);
  let bx=e.px-w/2, by=e.py-34;
  bx=Math.max(2,Math.min(GW*TILE-w-2,bx)); by=Math.max(2,by);
  ctx.fillStyle='rgba(20,24,33,.92)';
  roundRect(bx,by,w,18,6); ctx.fill();
  ctx.strokeStyle=STCOLOR[e.state]||'#666'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#e8ebf4'; ctx.textAlign='center';
  ctx.fillText(text.length>34?text.slice(0,33)+'…':text, bx+w/2, by+13);
}

let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  simMin += dt*SPEED*1.4;
  for(const e of emps) e.update(dt);
  drawMap();
  const sorted=[...emps].sort((a,b)=>a.py-b.py);
  for(const e of sorted) drawEmp(e,now);
  for(const e of sorted) drawBubble(e,now);
  document.getElementById('clock').textContent=clockStr();
  applyLinkStates();
  const st=taskStats();
  document.getElementById('stepname').textContent = st.total?
    `지시 업무 ${st.total}건 — 완료 ${st.done} · 진행 ${st.run} · 대기 ${st.idle}` : '지시 대기 — 시킬 일을 말씀해 주세요';
  document.getElementById('barfill').style.width=(st.total? Math.round(st.done/st.total*100):0)+'%';
  requestAnimationFrame(frame);
}

cv.addEventListener('click',ev=>{
  const r=cv.getBoundingClientRect();
  const mx=(ev.clientX-r.left), my=(ev.clientY-r.top);
  let best=null,bd=1e9;
  for(const e of emps){ if(!e.spawned) continue;
    const d=Math.hypot(e.px-mx,e.py-my); if(d<bd){bd=d;best=e;} }
  if(best && bd<16) personAnswer(best);
});
